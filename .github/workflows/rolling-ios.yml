name: Publish rolling previews

on:
  push:
    branches:
      - rolling
  pull_request:
    branches:
      - rolling
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rolling-previews-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    if: github.ref == 'refs/heads/rolling' || github.base_ref == 'rolling'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            artifact: macos
            extension: dmg
            filename: KelmaReview-Rolling-macOS.dmg
          - os: windows-latest
            artifact: windows
            extension: msi
            filename: KelmaReview-Rolling-Windows.msi
          - os: ubuntu-latest
            artifact: linux
            extension: deb
            filename: KelmaReview-Rolling-Linux.deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bluelife8/kelma-fsrs-v6
          ref: 19c858e8e46449d50b316ad9937cbc4d5ac91dcc
          path: kelma-fsrs-v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure the MSVC compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Package rolling desktop app
        run: >-
          ./gradlew -PkelmaFsrsPath=kelma-fsrs-v6
          :desktopApp:createDistributable
          :desktopApp:packageDistributionForCurrentOS
      - name: Verify packaged legal notices
        run: python scripts/check_packaged_legal_notices.py desktopApp/build/compose/binaries/main/app
      - name: Verify packaged Java runtime modules
        if: runner.os == 'macOS'
        run: python scripts/check_desktop_runtime_modules.py
      - name: Verify packaged desktop JVM arguments
        if: runner.os == 'macOS'
        run: python scripts/check_desktop_jvm_args.py desktopApp/build/compose/binaries/main/app
      - name: Stage rolling desktop package
        shell: bash
        run: |
          PACKAGE="$(find desktopApp/build/compose/binaries/main -type f -name '*.${{ matrix.extension }}' -print -quit)"
          test -n "$PACKAGE"
          test -s "$PACKAGE"
          mkdir -p rolling-release
          cp "$PACKAGE" "rolling-release/${{ matrix.filename }}"
      - uses: actions/upload-artifact@v4
        with:
          name: kelma-review-${{ matrix.artifact }}-rolling-${{ github.run_number }}
          path: rolling-release/${{ matrix.filename }}
          retention-days: 14
          if-no-files-found: error

  ios:
    if: github.ref == 'refs/heads/rolling' || github.base_ref == 'rolling'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bluelife8/kelma-fsrs-v6
          ref: 19c858e8e46449d50b316ad9937cbc4d5ac91dcc
          path: kelma-fsrs-v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build distinct unsigned rolling IPA
        env:
          ORG_GRADLE_PROJECT_kelmaFsrsPath: ${{ github.workspace }}/kelma-fsrs-v6
        run: |
          BASE_VERSION="$(awk -F= '/^MARKETING_VERSION=/{print $2}' iosApp/Configuration/Config.xcconfig)"
          BUILD_VERSION="$GITHUB_RUN_NUMBER"
          test -n "$BASE_VERSION"
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-rolling \
            MARKETING_VERSION="$BASE_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_VERSION" \
            PRODUCT_BUNDLE_IDENTIFIER='tech.kelma.app.KelmaReview.Rolling' \
            INFOPLIST_KEY_CFBundleDisplayName='Kelma Rolling' \
            ASSETCATALOG_COMPILER_APPICON_NAME='AppIcon-Rolling' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            build
          APP_PATH='build/ios-rolling/Build/Products/Release-iphoneos/Kelma Review.app'
          INFO_PLIST="$APP_PATH/Info.plist"
          test -d "$APP_PATH"
          python3 scripts/check_packaged_legal_notices.py "$APP_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO_PLIST")" = \
            'tech.kelma.app.KelmaReview.Rolling'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$INFO_PLIST")" = \
            'Kelma Rolling'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST")" = \
            "$BASE_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST")" = \
            "$BUILD_VERSION"
          mkdir -p rolling-release/Payload
          cp -R "$APP_PATH" rolling-release/Payload/
          (
            cd rolling-release
            zip -qry KelmaReview-Rolling.ipa Payload
            rm -rf Payload
          )
          python3 scripts/check_rolling_build.py --ipa rolling-release/KelmaReview-Rolling.ipa
          IPA_SHA256="$(shasum -a 256 rolling-release/KelmaReview-Rolling.ipa | awk '{print $1}')"
          IPA_SIZE="$(stat -f '%z' rolling-release/KelmaReview-Rolling.ipa)"
          python3 - "$BASE_VERSION" "$BUILD_VERSION" "$IPA_SHA256" "$IPA_SIZE" <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          version, build, sha256, size = sys.argv[1:]
          metadata = {
              "channel": "rolling",
              "version": version,
              "buildVersion": build,
              "bundleIdentifier": "tech.kelma.app.KelmaReview.Rolling",
              "commit": os.environ["GITHUB_SHA"],
              "builtAt": datetime.now(timezone.utc).isoformat(),
              "size": int(size),
              "sha256": sha256,
              "run": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }
          Path("rolling-release/rolling-build.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kelma-review-ios-rolling-${{ github.run_number }}
          path: rolling-release/*
          retention-days: 14
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request'
    needs: [desktop, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: rolling-release
          merge-multiple: true
      - name: Verify and checksum the complete rolling release
        run: |
          cd rolling-release
          for file in \
            KelmaReview-Rolling.ipa \
            KelmaReview-Rolling-macOS.dmg \
            KelmaReview-Rolling-Windows.msi \
            KelmaReview-Rolling-Linux.deb \
            rolling-build.json; do
            test -s "$file"
          done
          rm -f SHA256SUMS.txt
          while IFS= read -r -d '' file; do
            printf '%s  %s\n' "$(sha256sum "$file" | cut -d ' ' -f 1)" "$(basename "$file")"
          done < <(find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z) > SHA256SUMS.txt
      - name: Update mutable rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > rolling-release-notes.md <<EOF
          This prerelease is a mutable test channel built from the rolling branch.

          Commit: ${GITHUB_SHA}
          Workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          iPhone and iPad use a separate bundle ID and can coexist with the stable app. The unsigned desktop packages are rolling builds for macOS, Windows, and Linux. Desktop packages use the normal Kelma Review application identity and local data location, so close Kelma Review before installing and do not run stable and rolling desktop builds at the same time.

          All signed-in rolling builds connect to real KelmaSync account data. Reviews, cards, media, and account changes can affect production data.
          EOF
          if gh release view rolling --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit rolling \
              --repo "$GITHUB_REPOSITORY" \
              --title 'Kelma Review Rolling' \
              --notes-file rolling-release-notes.md \
              --prerelease
          else
            gh release create rolling \
              --repo "$GITHUB_REPOSITORY" \
              --target rolling \
              --title 'Kelma Review Rolling' \
              --notes-file rolling-release-notes.md \
              --prerelease \
              --latest=false
          fi
          gh release upload rolling rolling-release/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
