name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  jvm-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bluelife8/kelma-fsrs-v6
          ref: 19c858e8e46449d50b316ad9937cbc4d5ac91dcc
          path: kelma-fsrs-v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 36 and native toolchain
        run: >-
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Verify dependency policy and SBOM
        run: |
          ./scripts/generate-sbom.sh
          python3 scripts/check_dependency_policy.py
          git diff --exit-code -- sbom.cdx.json
      - name: Verify desktop JVM arguments
        run: python3 scripts/check_desktop_jvm_args.py
      - name: Test JVM core and desktop UI
        run: >-
          xvfb-run --auto-servernum
          ./gradlew
          -PkelmaFsrsPath=kelma-fsrs-v6
          :shared:jvmTest
      - name: Verify migrations, Android, and desktop compilation
        run: >-
          ./gradlew
          -PkelmaFsrsPath=kelma-fsrs-v6
          :shared:verifySqlDelightMigration
          :shared:testAndroidHostTest
          :shared:compileAndroidDeviceTest
          :desktopApp:compileKotlin
          :androidApp:assembleDebug
          :androidApp:bundlePlay
      - name: Verify packaged legal notices and store build policy
        run: |
          python3 scripts/check_packaged_legal_notices.py \
            androidApp/build/outputs/apk/debug/androidApp-debug.apk
          python3 scripts/check_packaged_legal_notices.py \
            androidApp/build/outputs/bundle/play/androidApp-play.aab
          python3 scripts/check_store_build.py \
            --artifact androidApp/build/outputs/bundle/play/androidApp-play.aab \
            --kind android-play

  ios:
    # Compose 1.11 links UIKit symbols provided by the Xcode 26 SDK.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bluelife8/kelma-fsrs-v6
          ref: 19c858e8e46449d50b316ad9937cbc4d5ac91dcc
          path: kelma-fsrs-v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile shared tests and plugin-free App Store framework for iOS Simulator
        run: |
          ./gradlew \
            -PkelmaFsrsPath=kelma-fsrs-v6 \
            :shared:compileTestKotlinIosSimulatorArm64
          ./gradlew \
            -PkelmaFsrsPath=kelma-fsrs-v6 \
            -PkelmaAppStoreBuild=true \
            :shared:linkReleaseFrameworkIosSimulatorArm64
          test -z "$(nm -gj shared/build/bin/iosSimulatorArm64/releaseFramework/Shared.framework/Shared | \
            grep -E 'kelma_lua|luaL_newstate' || true)"
          python3 scripts/check_store_build.py --check-xcode
      - name: Verify signed Keychain-capable Simulator app
        env:
          IOS_SIMULATOR_BUILD_ONLY: "1"
          SHOW_SIMULATOR: "0"
        run: ./scripts/run-ios-simulator.sh
