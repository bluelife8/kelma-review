name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  jvm-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bluelife8/kelma-fsrs-v6
          ref: 8d3844efb01122748fb83497f39255924f905294
          path: kelma-fsrs-v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 36 and native toolchain
        run: >-
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Verify dependency policy and SBOM
        run: |
          ./scripts/generate-sbom.sh
          python3 scripts/check_dependency_policy.py
          git diff --exit-code -- sbom.cdx.json
      - name: Verify desktop JVM arguments
        run: python3 scripts/check_desktop_jvm_args.py
      - name: Test core, migrations, desktop, and Android
        run: >-
          ./gradlew
          -PkelmaFsrsPath=kelma-fsrs-v6
          :shared:jvmTest
          :shared:verifySqlDelightMigration
          :shared:testAndroidHostTest
          :shared:compileAndroidDeviceTest
          :desktopApp:compileKotlin
          :androidApp:assembleDebug

  ios:
    # Compose 1.11 links UIKit symbols provided by the Xcode 26 SDK.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bluelife8/kelma-fsrs-v6
          ref: 8d3844efb01122748fb83497f39255924f905294
          path: kelma-fsrs-v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile shared tests for iOS Simulator
        run: >-
          ./gradlew
          -PkelmaFsrsPath=kelma-fsrs-v6
          :shared:compileTestKotlinIosSimulatorArm64
      - name: Verify signed Keychain-capable Simulator app
        env:
          IOS_SIMULATOR_BUILD_ONLY: "1"
          SHOW_SIMULATOR: "0"
        run: ./scripts/run-ios-simulator.sh
